<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pundiku</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pundiku">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f0fa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" type="image/png" href="ikon-192.png">
<script>window.PUNDIKU_PWA = 1;</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onload="window.pkChartSiap && pkChartSiap()"></script>
<style>
:root{
  --bg:#f3f0fa; --ink:#2b2840; --muted:#7c7792; --faint:#a9a4bd;
  --glass:rgba(255,255,255,.46); --glass-2:rgba(255,255,255,.64); --edge:rgba(255,255,255,.78);
  --shadow:0 10px 36px rgba(110,90,170,.13), 0 1px 0 rgba(255,255,255,.6) inset;
  --mint:#3fb995; --mint-soft:#c9f0e2; --rose:#e2728a; --rose-soft:#fbd6de;
  --lav:#8b78e6; --lav-soft:#dfd8ff; --amber:#e9a14f; --amber-soft:#ffe4c4; --sky-soft:#d4ecff;
  --r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;font-size:15px}
body{padding:max(14px,env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom));overflow-x:hidden;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.75;z-index:0;pointer-events:none;animation:melayang 22s ease-in-out infinite alternate}
.b1{width:380px;height:380px;background:#cdbdff;top:-120px;left:-110px}
.b2{width:340px;height:340px;background:#ffd2c2;top:30%;right:-140px;animation-delay:-6s}
.b3{width:360px;height:360px;background:#bdeedb;bottom:-140px;left:-60px;animation-delay:-12s}
.b4{width:260px;height:260px;background:#c4e4ff;top:55%;left:30%;opacity:.55;animation-delay:-3s}
@keyframes melayang{to{transform:translate(40px,30px) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
.wadah{position:relative;z-index:1;max-width:560px;margin:0 auto}
main{display:flex;flex-direction:column;gap:12px}
main.masuk-kanan{animation:dariKanan .32s cubic-bezier(.2,.8,.2,1)}
main.masuk-kiri{animation:dariKiri .32s cubic-bezier(.2,.8,.2,1)}
@keyframes dariKanan{from{opacity:.2;transform:translateX(36px)}}
@keyframes dariKiri{from{opacity:.2;transform:translateX(-36px)}}
@media (min-width:980px){.wadah{max-width:1000px}main.dua{display:grid;grid-template-columns:1fr 1fr;align-items:start}.lebar{grid-column:1/-1}}

.kaca{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);padding:18px}
h2{margin:0 0 12px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 small{text-transform:none;letter-spacing:0;font-weight:600;color:var(--faint)}
.num{font-variant-numeric:tabular-nums}

/* kepala */
.atas{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 10px}
.merek{display:flex;align-items:center;gap:10px;min-width:0}
.merek>div{min-width:0}
.merek img{width:40px;height:40px;border-radius:12px;box-shadow:0 6px 16px rgba(110,90,170,.22)}
.merek b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.merek span{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kanan{display:flex;gap:8px}
.tombol{position:relative;border:1px solid var(--edge);background:var(--glass-2);color:var(--ink);border-radius:14px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 4px 14px rgba(110,90,170,.12)}
.tombol svg{width:20px;height:20px}
.tombol.putar svg{animation:putar 1s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.lencana{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#ef5a78;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.goyang svg{animation:goyang 2.4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes goyang{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}

/* teks berjalan */
.jalan{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.4);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);margin-bottom:12px;height:38px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.jalan .pita{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform;animation:geser var(--durasi,40s) linear infinite}
.jalan.jeda .pita{animation-play-state:paused}
.jalan .pita span{font-size:13px;font-weight:600;padding:0 14px;color:var(--ink)}
.jalan .pita span.motivasi{color:var(--lav);font-style:italic}
.jalan .pita i{font-style:normal;color:var(--faint)}
@keyframes geser{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.jalan .pita{animation-duration:calc(var(--durasi,40s) * 2)}}

/* lembar notifikasi */
.tirai{position:fixed;inset:0;z-index:30;background:rgba(43,40,64,.12);display:none}
.tirai.buka{display:block}
.notif{position:absolute;top:calc(64px + env(safe-area-inset-top));right:16px;left:16px;max-width:420px;margin-left:auto;padding:14px;animation:turun .22s ease-out;max-height:calc(100vh - 190px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.tutup-x{border:0;background:rgba(255,255,255,.7);width:28px;height:28px;border-radius:50%;font:inherit;font-size:16px;line-height:1;color:var(--muted);cursor:pointer}
@keyframes turun{from{opacity:0;transform:translateY(-8px)}}
.notif h2{margin-bottom:10px}
.ingat{display:flex;flex-direction:column;gap:9px}
.ig{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.58);border:1px solid var(--edge);border-radius:16px;padding:11px 12px}
.ig.mendesak{border-color:rgba(239,90,120,.45);background:rgba(255,236,240,.75)}
.ig .ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:17px}
.ig div{flex:1;min-width:0}
.ig b{display:block;font-size:13.5px}
.ig span{font-size:12px;color:var(--muted)}
.ig strong{font-size:13.5px;white-space:nowrap}

/* kartu utama */
.hero{background:linear-gradient(135deg,rgba(255,255,255,.66),rgba(255,255,255,.34));position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(139,120,230,.28),transparent 70%);pointer-events:none}
.hero .label{font-size:12.5px;color:var(--muted);font-weight:600}
.hero .besar{font-size:33px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:rgba(255,255,255,.52);border:1px solid var(--edge);border-radius:16px;padding:10px}
.mini span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.mini b{font-size:14px}

.bulan{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.bulan::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--edge);background:var(--glass);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{padding:14px}
.k span{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.k b{display:block;font-size:18.5px;font-weight:800;margin-top:6px;letter-spacing:-.01em}
.k em{font-style:normal;font-size:11.5px;color:var(--faint);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bar{height:8px;border-radius:99px;background:rgba(120,110,160,.13);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8ee0c4,#3fb995)}
.bar i.lewat{background:linear-gradient(90deg,#f6b6c3,#e2728a)}
.bar i.awas{background:linear-gradient(90deg,#ffd9a8,#e9a14f)}

.grafik{position:relative;height:210px}
.donat{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.donat .grafik{height:150px}
.legenda{display:flex;flex-direction:column;gap:7px;font-size:12.5px;min-width:0}
.legenda div{display:flex;align-items:center;gap:8px}
.legenda span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-weight:600}
.legenda b{font-size:12.5px}
.ang{display:flex;flex-direction:column;gap:12px}
.ang .baris{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.ang .baris em{font-style:normal;color:var(--muted);font-weight:600;font-size:12px}

/* logo bank / koin */
.logo{position:relative;width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;overflow:hidden;
  background:#fff;border:1px solid rgba(255,255,255,.9);box-shadow:0 3px 10px rgba(110,90,170,.12);font-size:18px}
.logo i{font-style:normal;font-weight:800;font-size:12px;letter-spacing:-.02em;color:#fff}
.logo img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;background:#fff;border-radius:6px}
.logo.kecil{width:34px;height:34px;border-radius:11px}
.logo.kecil img{inset:5px;width:calc(100% - 10px);height:calc(100% - 10px)}

/* saldo */
.total-uang .besar{font-size:28px;font-weight:800;margin-top:4px}
.grup{font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin:4px 4px -2px}
.rk{display:flex;align-items:center;gap:12px;padding:12px 14px}
.rk>div:not(.logo){flex:1;min-width:0}
.rk>div b{display:block;font-size:14px}
.rk>div span{font-size:11.5px;color:var(--muted)}
.rk strong{font-size:15px;white-space:nowrap}
.rk.neg strong{color:var(--rose)}

/* investasi */
.porsi{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:4px 0 12px}
.porsi i{display:block;height:100%}
.chips-porsi{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.chips-porsi span{display:flex;align-items:center;gap:6px}
.inv-kepala{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.inv-kepala .ikon-grup{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.inv-kepala div{flex:1;min-width:0}
.inv-kepala b{display:block;font-size:15px}
.inv-kepala span{font-size:12px;color:var(--muted);font-weight:600}
.inv-kepala strong{font-size:16px;text-align:right}
.inv-kepala strong small{display:block;font-size:11.5px;font-weight:700;white-space:nowrap}
.it{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid rgba(255,255,255,.75)}
.it>div:not(.logo){flex:1;min-width:0}
.it>div b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it>div span{font-size:11.5px;color:var(--muted)}
.it>div.kanan-it{text-align:right;flex:0 0 auto;min-width:auto;max-width:66%}
.it .kanan-it strong{display:block;font-size:13.5px}
.pl{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;margin-top:2px;white-space:nowrap}
.pl.naik{background:var(--mint-soft);color:#23946f}
.pl.turun{background:var(--rose-soft);color:#c24a65}
.pl.netral{background:rgba(120,110,160,.12);color:var(--muted)}

/* transaksi */
.cari{width:100%;border:1px solid var(--edge);background:rgba(255,255,255,.58);border-radius:14px;padding:11px 14px;font:inherit;font-size:14px;color:var(--ink);outline:none;margin-bottom:10px}
.cari:focus{border-color:var(--lav)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.filter .chip{padding:6px 12px;font-size:12px}
.hari{font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;margin:14px 2px 6px;display:flex;justify-content:space-between}
.tx{display:flex;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid rgba(255,255,255,.7)}
.tx .ico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:16px;font-weight:800}
.tx .isi{flex:1;min-width:0}
.tx .isi b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;font-weight:600;line-height:1.35}
.tx .isi span{font-size:11.5px;color:var(--muted)}
.tx .nom{font-weight:800;font-size:13.5px;white-space:nowrap}
.masuk{color:var(--mint)} .keluar{color:var(--rose)} .pindah{color:var(--lav)}
.lagi{width:100%;margin-top:10px;border:1px solid var(--edge);background:rgba(255,255,255,.58);border-radius:14px;padding:11px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.kosong{color:var(--muted);font-size:13px;text-align:center;padding:16px}
.kaki{text-align:center;font-size:11.5px;color:var(--faint);padding:6px}

/* bilah tab kaca cair ala iPhone — bisa ditap atau digeser */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 24px));
  display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border-radius:32px;touch-action:none;
  background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.12));
  border:1px solid rgba(255,255,255,.55);
  -webkit-backdrop-filter:blur(9px) saturate(210%) brightness(1.06);backdrop-filter:blur(9px) saturate(210%) brightness(1.06);
  box-shadow:0 12px 34px rgba(70,50,140,.18), inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 2px rgba(255,255,255,.35), inset 0 0 18px rgba(255,255,255,.18)}
.tabbar:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 70%,rgba(255,255,255,.28) 100%);mix-blend-mode:overlay}
.pil{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / 5);border-radius:27px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.52));
  box-shadow:0 4px 14px rgba(110,90,170,.18), inset 0 1px 1px #fff, inset 0 -1px 2px rgba(139,120,230,.12);
  transition:transform .5s cubic-bezier(.25,1.35,.45,1), background .25s, box-shadow .25s}
.tabbar.seret .pil{transition:background .2s, box-shadow .2s;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.18));
  -webkit-backdrop-filter:blur(3px) saturate(220%);backdrop-filter:blur(3px) saturate(220%);
  box-shadow:0 10px 26px rgba(110,90,170,.26), inset 0 1px 2px #fff, inset 0 0 0 1px rgba(255,255,255,.75), inset 0 -2px 6px rgba(139,120,230,.18)}
.tab{position:relative;z-index:1;border:0;background:transparent;font:inherit;color:#6f6a86;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:26px;cursor:pointer;font-size:10px;font-weight:700;transition:color .2s, transform .2s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--lav)}
.tabbar.seret .tab.dekat{transform:scale(1.08);color:var(--lav)}

.muat{height:120px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.7),rgba(255,255,255,.35));background-size:200% 100%;animation:kilau 1.3s infinite}
@keyframes kilau{to{background-position:-200% 0}}
.galat{color:var(--rose);font-weight:600}
.atur{display:flex;flex-direction:column;gap:10px}
.atur p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.atur label{font-size:12px;font-weight:700;color:var(--muted)}
.atur .cari{margin:4px 0 0}
.utama{border:0;border-radius:14px;padding:13px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#a08cf0,#8b78e6);cursor:pointer;box-shadow:0 8px 20px rgba(139,120,230,.35)}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>

function terima(d){

function hitungBulan(ym){
  const r = { masuk:0, keluar:0, titipKeluar:0, titipMasuk:0, luarAnggaran:0, kat:{}, n:0, kurs:0 };
  D.trx.forEach(t => {
    if (bulanDari(t.tgl) !== ym) return;
    r.n++;
    if (t.jenis === "Pemasukan") { if (isTitipan(t.kategori)) r.titipMasuk += t.nominal; else r.masuk += t.nominal; }
    else if (t.jenis === "Pengeluaran") {
      if (isTitipan(t.kategori)) { r.titipKeluar += t.nominal; return; }
      r.keluar += t.nominal;
      const k = t.kategori || "Lain-lain"; r.kat[k] = (r.kat[k] || 0) + t.nominal;
      if (/Novi|Keluarga/i.test(t.kategori)) r.luarAnggaran += t.nominal;
    }
  });
  (D.untungKurs || []).forEach(u => { if (bulanDari(u.tgl) === ym) r.kurs += u.untung; });
  r.dalamAnggaran = r.keluar - r.luarAnggaran;
  return r;
}

/* untung/rugi: nominal Rp + persen, mis. "−Rp357.506 (−9,3%)" */
const plTeks = (untung, p) => {
  const naik = (untung || 0) >= 0, tanda = naik ? "+" : "−";
  if (tutup) return `${tanda}Rp ${BINTANG} (${tanda}**%)`;
  const nom = tanda + "Rp" + Math.round(Math.abs(untung || 0)).toLocaleString("id-ID");
  return p == null ? nom : `${nom} (${tanda}${desimal(Math.abs(p * 100), 1)}%)`;
};
const plChip = (p, untung, adaModal) => {
  if (!adaModal) return `<span class="pl netral">${adaModal === false ? "modal ?" : "–"}</span>`;
  return `<span class="pl ${(untung || 0) >= 0 ? "naik" : "turun"}">${plTeks(untung, p)}</span>`;
};
function rincian(g, x){
  if (g.id === "crypto") {
    const m = x.nama.match(/^(.*?)\s*\((\w+)\)\s*-\s*(\w+)\s*(?:\((.*)\))?/) || [];
    const koin = m[1] || x.nama, sym = m[2] || "", plat = m[3] || "", ket = m[4] || "";
    const jml = tutup ? BINTANG : desimal(x.jumlah, x.jumlah >= 1000 ? 0 : 6);
    const stake = x.stake > 0 ? ` · di-stake${x.apy ? " " + desimal(x.apy*100, 2) + "%" : ""}` : (ket && !/liquid/i.test(ket) ? " · " + esc(ket) : "");
    return { judul: `${esc(koin)} <small style="color:var(--faint);font-weight:700">${esc(sym)}</small>`, sub: `${jml} ${esc(sym)} · ${esc(plat)}${stake}`, kunci: x.nama };
  }
  if (g.id === "saham") return { judul: esc(x.nama), sub: `${tutup ? "**" : desimal(x.lot,0)} lot · harga ${tutup ? BINTANG : "Rp" + desimal(x.harga, 0)}`, kunci: x.nama };
  if (g.id === "emas") return { judul: esc(x.nama.replace(/^Emas digital\s*-\s*/i, "Emas · ")), sub: `${tutup ? "**" : desimal(x.gram, 4)} gram · buyback ${tutup ? BINTANG : "Rp" + desimal(x.harga, 0)}/g`, kunci: x.nama };
  if (g.id === "deposito") return { judul: esc(x.nama), sub: `${x.bunga ? desimal(x.bunga*100, 2) + "%/thn · " : ""}jatuh tempo ${tglPendek(x.tempo)}`, kunci: "Deposito" };
  return { judul: esc(x.nama.replace(/\s*\(Bibit\)/i, "")), sub: "Bibit", kunci: x.nama };
}

      ${isi.map(x => { const r = rincian(g, x), adaModal = g.id === "bibit" ? undefined : !!x.modal;

function daftar(){
  const q = kataCari.trim().toLowerCase();
  const rows = D.trx.filter(t => bulanDari(t.tgl) === bulanPilih)
    .filter(t => filterJenis === "semua" ? true : filterJenis === "titipan" ? isTitipan(t.kategori) : t.jenis === filterJenis)
    .filter(t => !q || [t.ket, t.kategori, t.rek, t.tujuan].join(" ").toLowerCase().includes(q))
    .sort((a,b) => b.tgl.localeCompare(a.tgl) || (+b.no) - (+a.no));
  const el = $("#daftar");
  if (!rows.length) { el.innerHTML = '<div class="kosong">Tidak ada transaksi.</div>'; return; }
  let html = "", hariIni = "";
  rows.slice(0, batasTampil).forEach(t => {
    if (t.tgl !== hariIni) {
      hariIni = t.tgl; const d = new Date(t.tgl + "T00:00:00");
      const tot = rows.filter(x => x.tgl === t.tgl && x.jenis === "Pengeluaran" && !isTitipan(x.kategori)).reduce((s,x) => s + x.nominal, 0);
      html += `<div class="hari"><span>${HARI[d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]}</span><span class="num">${tot ? "−" + singkat(tot) : ""}</span></div>`;
    }
    const masuk = t.jenis === "Pemasukan", pindahan = t.jenis === "Transfer Internal";
    const kls = pindahan ? "pindah" : masuk ? "masuk" : "keluar";
    const ico = pindahan ? ["⇄","var(--lav-soft)"] : isTitipan(t.kategori) ? ["🧧","var(--amber-soft)"] : masuk ? ["↓","var(--mint-soft)"] : ["↑","var(--rose-soft)"];
    const sub = pindahan ? `${esc(t.rek)} → ${esc(t.tujuan)}` : `${esc(t.kategori || t.jenis)} · ${esc(t.rek)}`;
    html += `<div class="tx"><div class="ico ${kls}" style="background:${ico[1]}">${ico[0]}</div><div class="isi"><b>${esc(t.ket || t.kategori || t.jenis)}</b><span>${sub}</span></div>
      <div class="nom num ${kls}">${pindahan || tutup ? "" : masuk ? "+" : "−"}${rp(t.nominal).replace("−","")}</div></div>`;
  });
  if (rows.length > batasTampil) html += `<button class="lagi" id="lagi" type="button">Tampilkan ${Math.min(40, rows.length - batasTampil)} lagi</button>`;
  el.innerHTML = html;
  const l = $("#lagi"); if (l) l.onclick = () => { batasTampil += 40; daftar(); };
}

/* ---------- pengingat (ikon bel + teks berjalan) ---------- */
function notifikasi(){
  const hari0 = new Date(D.hariIni + "T00:00:00");
  const jatuh = tgl => { let t = new Date(hari0.getFullYear(), hari0.getMonth(), tgl);
    if (t < hari0) t = new Date(hari0.getFullYear(), hari0.getMonth()+1, tgl); return { hari: Math.round((t-hari0)/864e5), t }; };
  const teksHari = h => h === 0 ? "hari ini" : h === 1 ? "besok" : h + " hari lagi";
  const ut = D.utang || [];
  const ccU = ut.find(x => /Kartu Kredit/i.test(x.nama)), spU = ut.find(x => /SPayLater/i.test(x.nama));
  const cc = (D.rekening || []).find(r => /Kartu Kredit/i.test(r.nama));
  const tagihan = ccU ? ccU.sisa : cc ? Math.max(0, -cc.saldo) : 0;
  const c5 = jatuh(ccU && ccU.tempo || 5), s25 = jatuh(spU && spU.tempo || 25);
  const piutang = (D.titipan || []).filter(t => !/^Lunas/i.test(t.status) && t.sisa > 0), totPiutang = piutang.reduce((s,t) => s + t.sisa, 0);
  const b = hitungBulan(bulanDari(D.hariIni)), lewat = (D.anggaran||[]).filter(a => a.batas > 0 && (b.kat[a.kategori]||0) > a.batas);
  const depo = ((D.investasi || {}).deposito || []).map(x => ({ x, h: x.tempo ? Math.round((new Date(x.tempo + "T00:00:00") - hari0)/864e5) : 999 })).filter(o => o.h >= 0 && o.h <= 45);
  const item = [];
  if (tagihan > 0 || c5.hari <= 7) item.push({ m: c5.hari <= 3 && tagihan > 0, ico:"💳", bg:"var(--rose-soft)", j:"Bayar Kartu Kredit BCA", s:`jatuh tempo ${c5.t.getDate()} ${BLN[c5.t.getMonth()]} · ${teksHari(c5.hari)}`, n: tagihan ? rp(tagihan) : "",
    jalan: `💳 Tagihan Kartu Kredit BCA ${tagihan ? rp(tagihan) + " " : ""}jatuh tempo ${c5.t.getDate()} ${BLN[c5.t.getMonth()]} (${teksHari(c5.hari)})` });
  if (!spU || spU.sisa > 0) item.push({ m: s25.hari <= 3, ico:"🛍️", bg:"var(--amber-soft)", j:"Bayar SPayLater", s:`jatuh tempo ${s25.t.getDate()} ${BLN[s25.t.getMonth()]} · ${teksHari(s25.hari)}`, n: spU ? rp(spU.sisa) : "",
    jalan: `🛍️ SPayLater jatuh tempo ${s25.t.getDate()} ${BLN[s25.t.getMonth()]} (${teksHari(s25.hari)})${spU ? ", sisa " + rp(spU.sisa) : ""}` });
  if (piutang.length) item.push({ m: true, ico:"🧧", bg:"var(--lav-soft)", j:`${piutang.length} titipan belum lunas`, s: piutang.slice(0,3).map(t => esc(t.nama)).join(", ") + (piutang.length > 3 ? " +" + (piutang.length-3) : ""), n: rp(totPiutang),
    jalan: `🧧 ${piutang.length} titipan belum lunas: ${piutang.slice(0,3).map(t => esc(t.nama)).join(", ")} (${rp(totPiutang)})` });
  if (lewat.length) item.push({ m: true, ico:"⚠️", bg:"var(--rose-soft)", j: lewat.length === 1 ? `Anggaran ${esc(lewat[0].kategori)} lewat` : `${lewat.length} anggaran lewat batas`,
    s: lewat.length === 1 ? `terpakai ${singkat(b.kat[lewat[0].kategori])} dari ${singkat(lewat[0].batas)}` : lewat.map(a => esc(a.kategori)).join(", "), n:"",
    jalan: `⚠️ Anggaran lewat batas: ${lewat.map(a => esc(a.kategori)).join(", ")}` });
  depo.forEach(o => item.push({ m: o.h <= 7, ico:"🏦", bg:"var(--sky-soft)", j:"Deposito jatuh tempo", s:`${tglPendek(o.x.tempo)} · ${teksHari(o.h)}`, n: rp(o.x.nilai),
    jalan: `🏦 Deposito jatuh tempo ${tglPendek(o.x.tempo)} (${teksHari(o.h)}), putuskan mau diperpanjang atau dicairkan` }));
  const penting = item.filter(i => i.m).length;
  const bel = $("#bel"); const lama = bel.querySelector(".lencana"); if (lama) lama.remove();
  bel.classList.toggle("goyang", penting > 0);
  if (penting) bel.insertAdjacentHTML("beforeend", `<span class="lencana">${penting}</span>`);
  $("#notif").innerHTML = `<h2><span>Pengingat <small>· ${penting ? penting + " perlu perhatian" : "aman semua 🎉"}</small></span><button class="tutup-x" id="tutupNotif" type="button" aria-label="Tutup">✕</button></h2><div class="ingat">${item.map(i =>
    `<div class="ig ${i.m ? "mendesak" : ""}"><div class="ico" style="background:${i.bg}">${i.ico}</div><div><b>${i.j}</b><span>${i.s}</span></div><strong class="num">${i.n}</strong></div>`).join("")}</div>`;
  $("#tutupNotif").onclick = () => $("#tirai").classList.remove("buka");

  // teks berjalan: pengingat diselingi kata-kata motivasi
  const kurs = b.kurs ? [`💱 Untung kurs bulan ini ${rp(b.kurs)}`] : [];
  const mot = MOTIVASI.slice().sort(() => Math.random() - .5).slice(0, 5);
  const ingatTeks = item.map(i => i.jalan).concat(kurs);
  const isi = [];
  const n = Math.max(ingatTeks.length, mot.length);
  for (let i = 0; i < n; i++) {
    if (ingatTeks[i]) isi.push(`<span>${ingatTeks[i]}</span>`);
    if (mot[i]) isi.push(`<span class="motivasi">✨ ${esc(mot[i])}</span>`);
  }
  const satu = isi.join("<i>•</i>") + "<i>•</i>";
  const pita = $("#pita");
  pita.innerHTML = satu + satu;                  // digandakan supaya berputar mulus
  requestAnimationFrame(() => {
    const lebar = pita.scrollWidth / 2;
    pita.style.setProperty("--durasi", Math.max(20, lebar / 55) + "s");   // ±55 px per detik
  });
}
$("#jalan").addEventListener("pointerdown", () => $("#jalan").classList.add("jeda"));
["pointerup","pointercancel","pointerleave"].forEach(ev => $("#jalan").addEventListener(ev, () => $("#jalan").classList.remove("jeda")));

/* ---------- bilah tab: tap atau geser gelembungnya seperti iPhone ---------- */
const bar = $("#tabbar"), pil = $("#pil"), tabs = [...bar.querySelectorAll(".tab")];
const lebarTab = () => (bar.clientWidth - 10) / HAL.length;
function geserPil(){
  const i = HAL.indexOf(hal);
  pil.style.transform = `translateX(${i * lebarTab()}px)`;
  tabs.forEach((t, k) => t.classList.toggle("on", k === i));
}
window.addEventListener("resize", geserPil);
let seret = null;
bar.addEventListener("pointerdown", e => {
  seret = { x0: e.clientX, aktif: false, id: e.pointerId };
  try { bar.setPointerCapture(e.pointerId); } catch(err) {}
});
bar.addEventListener("pointermove", e => {
  if (!seret) return;
  if (!seret.aktif && Math.abs(e.clientX - seret.x0) > 6) { seret.aktif = true; bar.classList.add("seret"); }
  if (!seret.aktif) return;
  const kotak = bar.getBoundingClientRect(), w = lebarTab();
  const x = Math.max(0, Math.min(kotak.width - 10 - w, e.clientX - kotak.left - 5 - w / 2));
  pil.style.transform = `translateX(${x}px) scale(1.1,1.14)`;
  const dekat = Math.round(x / w);
  tabs.forEach((t, k) => t.classList.toggle("dekat", k === dekat));
});
function lepas(e){
  if (!seret) return;
  const kotak = bar.getBoundingClientRect(), w = lebarTab();
  let i;
  if (seret.aktif) {
    const x = Math.max(0, Math.min(kotak.width - 10 - w, e.clientX - kotak.left - 5 - w / 2));
    i = Math.round(x / w);
  } else i = Math.max(0, Math.min(HAL.length - 1, Math.floor((e.clientX - kotak.left - 5) / w)));
  bar.classList.remove("seret"); tabs.forEach(t => t.classList.remove("dekat"));
  seret = null;
  if (HAL[i] !== hal) pindah(HAL[i]); else geserPil();
}
bar.addEventListener("pointerup", lepas);
bar.addEventListener("pointercancel", () => { seret = null; bar.classList.remove("seret"); geserPil(); });
geserPil();

/* geser layar ke kiri/kanan untuk pindah halaman */
let sentuh = null;
document.addEventListener("touchstart", e => {
  if (e.touches.length !== 1 || e.target.closest(".bulan,.tabbar,.tirai,canvas,input,.jalan")) { sentuh = null; return; }
  sentuh = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive: true });
document.addEventListener("touchend", e => {
  if (!sentuh || !D) return;
  const dx = e.changedTouches[0].clientX - sentuh.x, dy = e.changedTouches[0].clientY - sentuh.y;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2 && Date.now() - sentuh.t < 600) {
    const i = HAL.indexOf(hal) + (dx < 0 ? 1 : -1);
    if (i >= 0 && i < HAL.length) pindah(HAL[i], dx < 0 ? 1 : -1);
  }
  sentuh = null;
}, { passive: true });

/* ---------- grafik ---------- */
function buatGrafik(kat){
  if (!window.Chart) return;
  Chart.defaults.font.family = '"Plus Jakarta Sans", system-ui, sans-serif';
  Chart.defaults.color = "#7c7792";
  const tip = { backgroundColor:"rgba(43,40,64,.88)", padding:10, cornerRadius:12, callbacks:{ label: c => " " + (c.dataset.label ? c.dataset.label + ": " : "") + rp(c.parsed.y ?? c.parsed) } };
  const bulan = D.bulanAda.slice(-6), data = bulan.map(hitungBulan);
  const c1 = $("#cTren");
  if (c1) {
    const g = c1.getContext("2d"), gm = g.createLinearGradient(0,0,0,210), gr = g.createLinearGradient(0,0,0,210);
    gm.addColorStop(0,"#8ee0c4"); gm.addColorStop(1,"rgba(142,224,196,.35)");
    gr.addColorStop(0,"#f6b6c3"); gr.addColorStop(1,"rgba(246,182,195,.35)");
    charts.tren = new Chart(c1, { type:"bar", data:{ labels: bulan.map(m => BLN[+m.slice(5,7)-1]),
      datasets:[{ label:"Pemasukan", data:data.map(x => x.masuk), backgroundColor:gm, borderRadius:10, maxBarThickness:28 },
                { label:"Pengeluaran", data:data.map(x => x.keluar), backgroundColor:gr, borderRadius:10, maxBarThickness:28 }] },
      options:{ maintainAspectRatio:false, plugins:{ legend:{ labels:{ usePointStyle:true, pointStyle:"circle", boxWidth:7 } }, tooltip:tip },
        scales:{ x:{ grid:{ display:false }, border:{ display:false } }, y:{ grid:{ color:"rgba(120,110,160,.12)" }, border:{ display:false }, ticks:{ callback:v => singkat(v) } } } } });
  }
  const donat = (id, labels, vals, geser) => { const el = $(id); if (!el) return;
    charts[id] = new Chart(el, { type:"doughnut", data:{ labels, datasets:[{ data:vals, backgroundColor:labels.map((_,i) => WARNA[(i+geser)%WARNA.length]), borderWidth:3, borderColor:"rgba(255,255,255,.85)", hoverOffset:6 }] },
      options:{ maintainAspectRatio:false, cutout:"68%", plugins:{ legend:{ display:false }, tooltip:{ ...tip, callbacks:{ label:c => " " + c.label + ": " + rp(c.parsed) } } } } }); };
  donat("#cKat", kat.map(k => k[0]), kat.map(k => k[1]), 0);
  donat("#cAset", (D.komposisi||[]).map(a => a.nama), (D.komposisi||[]).map(a => Math.max(0,a.nilai)), 2);
}

window.pkChartSiap = () => { if (D && hal === "grafik") gambar(); };
muat();
})();
</script>
